apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
# immutable: true  ЗАПРЕЩАЕТ ИЗМЕНЯТЬ КОНФИГ МАП В ДЕПЛОЙМЕНТЕ
data: 
  file1.txt: |
    Текст и его
    содержимое
  file2.txt: |
    Text 2 i
    ego 
    soderhs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-first-deployment
  namespace: work
  labels:
    app: &app nginx
    version: &version 1.27.5
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: *app
      version: *version
  template:
    metadata:
      labels:
        app: *app
        version: *version
    spec:
      volumes:
        - name: config-volume
          configMap:
            name: app-config
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "300m"
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
          VolumeMounts:
            - name: config-volume
              mountPath: /etc/config


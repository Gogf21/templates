apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-deploy
  labels:
    app.kubernetes.io/name: &name test-dp
    app.kubernetes.io/instance: &instance test-dp
    app.kubernetes.io/version: &version v0.0.1
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: *name
      app.kubernetes.io/instance: *instance
      app.kubernetes.io/version: *version
  template:
    metadata:
      labels:
        app.kubernetes.io/name: *name
        app.kubernetes.io/instance: *instance
        app.kubernetes.io/version: *version
    spec:
      affinity:
        podAntiAffinity: # НЕ СТАВЬ МЕНЯ С ПОДОМ
          requiredDuringSchedulingIgnoredDuringExecution:  # Я НЕ ПОСТАВЛЮСЬ ВООБЩЕ ЕСЛИ ВЕЗДЕ ПОД БУДЕТ
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In 
                    values:
                      - test-dp
                  - key: app.kubernetes.io/version
                    operator: In # ЕСЛИ ЭТОТ ТЕГ СОДЕРЖИТСЯ В МАССИВЕ ЗНАЧЕНИЙ values
                    values:
                      - v0.0.1
              topologyKey: kubernetes.io/hostname # БУДЕТ ПРИМЕНЯТСЯ К НОДАМ ГДЕ ПРОСТО ЕСТЬ ЭТОТ ТЕГ
      #affinity:
      #  podAffinity: # ПОСТАВЬ МЕНЯ РЯДОМ С ЭТИМ ПОДОМ
      #    requiredDuringSchedulingIgnoredDuringExecution:
      #      - labelSelector:
      #          matchLabels:
      #            app: cache
      #        topologyKey: kubernetes.io/hostname
      containers:
        - name: whoami
          image: traefik/whoami
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
          resources:
            limits:
              cpu: 100m
              memory: 100Mi
            requests:
              cpu: 100m
              memory: 100Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 10
